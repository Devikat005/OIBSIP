
name: Deploy OIBSIP Projects

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p public/Level-1/Task-1-Landing-Page
          mkdir -p public/Level-1/Task-2-personal-portfolio
          mkdir -p public/Level-1/Task-3-temperature-converter

          cp -r Level-1/Task-1-Landing-Page/. public/Level-1/Task-1-Landing-Page/
          cp -r Level-1/Task-2-personal-portfolio/. public/Level-1/Task-2-personal-portfolio/
          cp -r Level-1/Task-3-temperature-converter/. public/Level-1/Task-3-temperature-converter/

          cp Level-1/Task-2-personal-portfolio/index.html public/index.html
          cp -r Level-1/Task-2-personal-portfolio/. public/
          mkdir -p public/Level-1
          touch public/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

